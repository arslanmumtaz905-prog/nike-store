<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wishlist</title>
  <link rel="stylesheet" href="file.css">
  <link rel="stylesheet" href="file.override.css">
</head>
<body>
  <header>
    <div class="logo">NIKE</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="orders.html">Orders</a>
      <a href="admin.html">Admin</a>
    </nav>
  </header>

  <main class="products">
    <h2>Your Wishlist</h2>
    <div id="wish-list" class="product-grid"></div>
  </main>

  <script>
  async function loadWishlist() {
    const ids = JSON.parse(localStorage.getItem('wishlist')||'[]');
    const res = await fetch('/products');
    const products = await res.json();
    const list = document.getElementById('wish-list');
    list.innerHTML = '';
    if (!ids.length) {
      list.innerHTML = '<div class="empty-state"><h3>Your wishlist is empty</h3><p>Browse products and tap the heart icon to save favorites.</p><a href="index.html" class="primary-btn">Go Shopping</a></div>';
      return;
    }
    ids.forEach(id=>{
      const p = products.find(x=>String(x.id)===String(id));
      if (!p) return;
      const div = document.createElement('div');
      div.className='product';
      div.innerHTML = `<img src="${p.img}" alt="${p.name}"><h3>${p.name}</h3><p>$${p.price}</p>`;
      const btn = document.createElement('button'); btn.innerText='Add to Cart';
      btn.addEventListener('click', ()=>{
        const cart = JSON.parse(localStorage.getItem('cart')||'[]');
        const existing = cart.find(i=>String(i.id)===String(p.id));
        if (existing) existing.quantity = (existing.quantity||1)+1; else cart.push({ id: String(p.id), name: p.name, price: p.price, img: p.img, quantity: 1 });
        localStorage.setItem('cart', JSON.stringify(cart));
        alert('Added to cart');
      });
      const rem = document.createElement('button'); rem.innerText='Remove';
      rem.addEventListener('click', ()=>{
        const newIds = ids.filter(x=>String(x)!==String(p.id));
        localStorage.setItem('wishlist', JSON.stringify(newIds));
        loadWishlist();
      });
      div.appendChild(btn);
      div.appendChild(rem);
      list.appendChild(div);
    });
  }
  loadWishlist();
  </script>
</body>
</html>
